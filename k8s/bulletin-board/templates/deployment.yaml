---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bulletin-board.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "bulletin-board.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bulletin-board.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metricsAgent.enabled }}
        checksum/agent-config: {{ include (print $.Template.BasePath "/unified-agent-config.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # ScheduleAnyway, а не DoNotSchedule: на двух узлах жёсткое правило
          # при сливе узла оставило бы вторую реплику в Pending — ровно в тот
          # момент, ради которого написан PDB.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "bulletin-board.selectorLabels" . | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            - name: management
              containerPort: {{ .Values.service.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "bulletin-board.name" . }}-config
            - secretRef:
                name: {{ .Values.secret.existingSecret }}
                optional: {{ .Values.secret.optional }}
          env:
            - name: MANAGEMENT_METRICS_TAGS_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MANAGEMENT_METRICS_TAGS_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: management
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # Корень только на чтение, поэтому JVM и приложению нужен
            # writable /tmp: hsperfdata и временные файлы загрузок.
            - name: tmp
              mountPath: /tmp
        {{- if .Values.metricsAgent.enabled }}
        - name: unified-agent
          image: {{ .Values.metricsAgent.image }}
          resources:
            {{- toYaml .Values.metricsAgent.resources | nindent 12 }}
          volumeMounts:
            - name: unified-agent-config
              mountPath: /etc/yandex/unified_agent/conf.d/
            - name: unified-agent-data
              mountPath: /var/lib/yandex/unified_agent/main
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.metricsAgent.enabled }}
        - name: unified-agent-config
          configMap:
            name: {{ .Values.metricsAgent.configMap }}
        - name: unified-agent-data
          emptyDir: {}
        {{- end }}
