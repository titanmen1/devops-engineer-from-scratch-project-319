---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bulletin-board.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # maxUnavailable: 0 — во время выката всегда остаётся полный набор рабочих
  # подов, новый поднимается сверх него.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "bulletin-board.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bulletin-board.selectorLabels" . | nindent 8 }}
      annotations:
        # Пересоздаём поды, когда меняется конфигурация: иначе приложение
        # продолжит работать со старыми значениями.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Разносим реплики по разным узлам. matchLabelKeys считает перекос только
      # среди подов текущей ревизии — без этого во время выката в расчёт
      # попадают ещё живые старые поды, и обе новые реплики уезжают на один узел.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "bulletin-board.selectorLabels" . | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            - name: management
              containerPort: {{ .Values.service.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "bulletin-board.name" . }}-config
            - secretRef:
                name: {{ .Values.secret.existingSecret }}
          # Micrometer вешает эти значения метками на все метрики приложения,
          # поэтому серии разных реплик не сливаются в Monitoring.
          env:
            - name: MANAGEMENT_METRICS_TAGS_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MANAGEMENT_METRICS_TAGS_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Под исчезает из endpoints не мгновенно: пауза даёт правилам
          # обновиться, без неё часть запросов при выкате рвётся.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Spring Boot поднимается около 30 секунд: пока идёт старт, за подом
          # следит startupProbe, и liveness не успевает его убить.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: management
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
        {{- if .Values.metricsAgent.enabled }}
        # Забирает метрики Actuator этого пода и отправляет их в Yandex
        # Monitoring. Авторизуется через метаданные узла — ключей нет.
        - name: unified-agent
          image: {{ .Values.metricsAgent.image }}
          resources:
            {{- toYaml .Values.metricsAgent.resources | nindent 12 }}
          volumeMounts:
            - name: unified-agent-config
              mountPath: /etc/yandex/unified_agent/conf.d/
            - name: unified-agent-data
              mountPath: /var/lib/yandex/unified_agent/main
        {{- end }}
      {{- if .Values.metricsAgent.enabled }}
      volumes:
        - name: unified-agent-config
          configMap:
            name: {{ .Values.metricsAgent.configMap }}
        - name: unified-agent-data
          emptyDir: {}
      {{- end }}
