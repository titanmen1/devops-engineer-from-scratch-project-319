---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bulletin-board.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "bulletin-board.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
