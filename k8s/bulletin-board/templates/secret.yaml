{{- if .Values.secret.create }}
---
# Запасной путь для окружения без Lockbox и External Secrets: значения
# передаются через `--set secret.values.*` или файл values вне репозитория.
# В git реальные доступы не коммитятся — образец полей в k8s/secret.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
