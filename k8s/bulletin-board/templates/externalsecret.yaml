{{- if .Values.externalSecrets.enabled }}
---
# Kubernetes-секрет с доступами приложения собирается из Lockbox и обновляется
# каждые refreshInterval. Значения в git не попадают.
#
# dataFrom.extract переносит все ключи секрета Lockbox как есть, поэтому при
# добавлении нового параметра чарт править не нужно.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: SecretStore
  target:
    name: {{ .Values.secret.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.lockboxSecretId обязателен при включённом ESO" .Values.externalSecrets.lockboxSecretId }}
{{- end }}
