---

namespace: bulletins
createNamespace: false

replicaCount: 2

image:
  repository: ghcr.io/titanmen1/project-devops-deploy
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  managementPort: 9090

ingress:
  enabled: true
  className: nginx
  host: ""
  path: /

config:
  SPRING_PROFILES_ACTIVE: prod
  STORAGE_S3_ENDPOINT: https://storage.yandexcloud.net
  STORAGE_S3_BUCKET: bulletins-319-media
  STORAGE_S3_REGION: ru-central1
  JAVA_OPTS: -Xms256m -Xmx640m
  MANAGEMENT_METRICS_ENABLE_EXECUTOR: "false"
  MANAGEMENT_METRICS_ENABLE_JDBC: "false"

secret:
  existingSecret: bulletin-secret
  create: false
  values: {}

externalSecrets:
  enabled: true
  storeName: yc-lockbox
  authorizedKeySecret: yc-sa-key
  lockboxSecretId: ""
  refreshInterval: 1h

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  readinessPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness

preStopSleepSeconds: 10
terminationGracePeriodSeconds: 45

pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpuUtilization: 70

metricsAgent:
  enabled: true
  image: cr.yandex/yc/unified-agent:latest
  configMap: unified-agent-config
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
