---
# Сбор логов подов приложения в Yandex Cloud Logging. Авторизация идёт через
# сервисный аккаунт узла (роль logging.writer выдана в terraform/kubernetes.tf),
# поэтому ключей в кластере нет.
#
# Идентификатор лог-группы подставляется при установке:
#   make logging-install
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
---
# Фильтр kubernetes дополняет записи именем пода, namespace и метками —
# для этого ему нужен доступ к API на чтение.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf

    # Фильтр по имени файла: собираем только логи namespace bulletins,
    # системные компоненты в лог-группу не попадают.
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_bulletins_*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # Приложение пишет структурированный JSON, поэтому Merge_Log раскладывает
    # его поля в корень записи: оттуда yc-logging забирает message и level.
    # Merge_Log_Key указывать нельзя — вложенные поля плагин не читает.
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        Annotations         Off

    [OUTPUT]
        Name           yc-logging
        Match          kube.*
        group_id       ${YC_LOG_GROUP_ID}
        message_key    message
        level_key      level
        default_level  INFO
        resource_type  k8s-pod
        authorization  instance-service-account
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      # Агент должен работать на каждом узле, включая узлы с taint'ами.
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: cr.yandex/yc/fluent-bit-plugin-yandex:v1.0.3-fluent-bit-1.8.6
          env:
            - name: YC_LOG_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-target
                  key: log_group_id
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibcontainers
              mountPath: /var/lib/containerd
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibcontainers
          hostPath:
            path: /var/lib/containerd
        - name: config
          configMap:
            name: fluent-bit-config
