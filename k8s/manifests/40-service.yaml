---
# Внутренний сервис приложения. Наружу трафик отдаёт ingress-контроллер
# (шаг 40), а для быстрой проверки хватает `kubectl port-forward`.
apiVersion: v1
kind: Service
metadata:
  name: bulletin-board
  namespace: bulletins
  labels:
    app: bulletin-board
spec:
  type: ClusterIP
  selector:
    app: bulletin-board
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: management
      port: 9090
      targetPort: management
