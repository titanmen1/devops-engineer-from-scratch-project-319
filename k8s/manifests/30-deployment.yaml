---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulletin-board
  namespace: bulletins
  labels:
    app: bulletin-board
spec:
  replicas: 2
  # maxUnavailable: 0 — во время выката всегда остаётся полный набор рабочих
  # подов, новый поднимается сверх него.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bulletin-board
  template:
    metadata:
      labels:
        app: bulletin-board
    spec:
      # Разносим реплики по разным узлам, чтобы падение узла не уносило
      # приложение целиком. DoNotSchedule обязателен: с мягким правилом обе
      # реплики после выката оказываются на одном узле.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: bulletin-board
          # Считаем перекос только среди подов текущей ревизии. Без этого во
          # время выката в расчёт попадают ещё живые старые поды, и обе новые
          # реплики законно уезжают на один узел.
          matchLabelKeys:
            - pod-template-hash
      # Времени хватает на preStop и на корректное завершение запросов.
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: ghcr.io/titanmen1/project-devops-deploy:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: bulletin-config
            - secretRef:
                name: bulletin-secret
          # Под исчезает из endpoints не мгновенно: балансировщик успевает
          # послать запрос в уже удаляемый под. Пауза перед остановкой даёт
          # правилам обновиться — без неё часть запросов при выкате рвётся.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Spring Boot поднимается около 30 секунд. Пока идёт старт, за подом
          # следит startupProbe, и liveness не успевает его убить.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

