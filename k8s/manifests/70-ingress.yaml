---
# Правило без host принимает запросы с любым заголовком Host, поэтому
# приложение доступно и по публичному адресу балансировщика, и по доменному
# имени, если его позже привяжут к этому адресу.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulletin-board
  namespace: bulletins
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bulletin-board
                port:
                  name: http
