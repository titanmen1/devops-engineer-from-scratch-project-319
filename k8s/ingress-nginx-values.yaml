---
controller:
  replicaCount: 2

  service:
    type: LoadBalancer
    # Local сохраняет реальный IP клиента в логах и X-Forwarded-For. Реплик
    # контроллера столько же, сколько узлов, поэтому узла без бэкенда — а с ним
    # и потери доступности — не возникает.
    externalTrafficPolicy: Local

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  metrics:
    enabled: true

  # DoNotSchedule здесь осознанно: при externalTrafficPolicy: Local узел без
  # пода контроллера не отвечает на проверки балансировщика, поэтому реплики
  # обязаны стоять на разных узлах.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
